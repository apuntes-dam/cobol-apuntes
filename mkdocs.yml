site_name: COBOL · Apuntes
site_description: Apuntes de COBOL siguiendo la estructura de la UD 1 (primer programa).
site_url: https://apuntes-dam.github.io/cobol-apuntes/
repo_url: https://github.com/apuntes-dam/cobol-apuntes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=a1917511
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - Mapa de unidades: unidades.md
  - "U1 · Primer programa":
      - u01/index.md
      - "1.1 Un programa": u01/01-programa.md
      - "1.2 Práctica con el lenguaje": u01/02-lenguaje.md
      - "1.3 Tipos de datos": u01/03-tipos.md
      - "1.4 Pruebas": u01/04-pruebas.md
      - "1.5 Entorno: GnuCOBOL y WSL": u01/05-entorno.md
      - "1.6 Bucles: PERFORM": u01/06-bucles.md
      - "Prácticas": u01/practicas.md
      - "Ejercicios de la unidad 1": u01/ejercicios.md
  - "U2 · Estructuras de control":
      - u02/index.md
      - "2.1 Condicionales": u02/01-condicionales.md
      - "2.3 Controlar errores": u02/02-errores.md
      - "2.4 Depurar": u02/03-depurar.md
      - "P2.1 · Sentencias condicionales": u02/condicionales.md
      - "P2.2 · Sentencias iterativas y saltos": u02/bucles.md
      - "P2.3 · Captura de excepciones": u02/excepciones.md
      - "P2.4 · Depurar programas": u02/depurar.md
  - "U3 · Estructuras de datos":
      - u03/index.md
      - "3.0 Cadenas": u03/00-cadenas.md
      - "3.1 Tablas": u03/01-tablas.md
      - "3.2-3.5 Mapas, conjuntos, JSON y XML": u03/02-mas-alla.md
      - "U3.0 · Cadenas": u03/cadenas.md
      - "U3.1 · Listas y tuplas": u03/tablas.md
